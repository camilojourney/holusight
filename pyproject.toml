[project]
name = "holusight"
version = "0.4.0"
description = "Read-only Graphify graph/source consistency helper for agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
holus = "holusight.cli_axi:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holusight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
