# STATUS (2026-09-18): this schedule is a proposal, not a running system.
# Nothing invokes these agents on this cadence — no cron, no CI job, no
# credential. The actually-running self-improvement loop today is
# `just improve-iterate` (src/holusight/improve_iterate.py), scheduled daily
# by .github/workflows/improve-iterate.yml. Activating the schedule below
# for real needs an ANTHROPIC_API_KEY secret and an explicit decision about
# recurring spend — see .self-improvement/MEMORY.md.
workers:
  manager:
    agent: .claude/agents/manager.md
    schedule: "0 9 * * 1"  # Monday 9am
    description: Weekly coordination and task assignment

  code-improver:
    agent: .claude/agents/code-improver.md
    schedule: "0 */6 * * *"  # Every 6 hours
    description: Improve code quality, add tests, fix lints

  security-sentinel:
    agent: .claude/agents/security-sentinel.md
    schedule: "0 2 * * *"  # Daily 2am
    description: Security audit — read-only invariant, path traversal

  judge-agent:
    agent: .claude/agents/judge-agent.md
    schedule: "30 */6 * * *"  # 30 min after code-improver
    description: Validate worker outputs, issue PASS/PARTIAL/FAIL

  prompt-optimizer:
    agent: .claude/agents/prompt-optimizer.md
    schedule: "0 10 * * 3"  # Wednesday 10am
    description: Benchmark retrieval quality, optimize queries

  model-quality-auditor:
    agent: .claude/agents/model-quality-auditor.md
    schedule: "0 10 * * 5"  # Friday 10am
    description: Benchmark embedding model performance

  static-analysis-expert:
    agent: .claude/agents/static-analysis-expert.md
    schedule: "0 10 1 * *"  # 1st of month 10am
    description: Research static analysis techniques, code quality metrics, MCP patterns
