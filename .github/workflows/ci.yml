name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Lint
        run: uv run --extra dev ruff check src/ tests/

      - name: Test
        run: uv run --extra dev pytest tests/ -q

      - name: Skill drift check
        run: uv run --extra dev pytest tests/test_axi_skill_drift.py -q
