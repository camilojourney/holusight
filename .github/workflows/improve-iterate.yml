name: Improve Iterate

# Scheduled, advisory-only measurement loop (ADR-0019). Runs `just
# improve-iterate` against master, records the receipt as a build artifact,
# and fails the job when progress is "regressed", "blocked", or
# "indeterminate" so a quality drop is visible without ever promoting,
# merging, or deploying anything on its own.

on:
  schedule:
    - cron: "0 13 * * *" # daily, 9am ET
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Run improve-iterate
        run: uv run --extra dev python -m codesight.improve_iterate | tee improve-iterate-receipt.json

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improve-iterate-receipt
          path: improve-iterate-receipt.json
