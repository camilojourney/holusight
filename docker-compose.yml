# Holusight single-team pilot deployment
# Usage:
#   export HOLUSIGHT_API_KEY=$(openssl rand -hex 24)
#   export HOLUSIGHT_DOCUMENTS_HOST_DIR=/path/to/customer/docs
#   docker compose up --build
# Open http://localhost:8000 and enter the API key in the sidebar.

services:
  holusight:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOLUSIGHT_API_KEY: ${HOLUSIGHT_API_KEY:?Set HOLUSIGHT_API_KEY in .env or shell}
      HOLUSIGHT_PRODUCTION: "1"
      HOLUSIGHT_DATA_DIR: /index
      HOLUSIGHT_DOCUMENTS_DIR: /data
      HOLUSIGHT_LLM_BACKEND: ${HOLUSIGHT_LLM_BACKEND:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${HOLUSIGHT_DOCUMENTS_HOST_DIR:?Set HOLUSIGHT_DOCUMENTS_HOST_DIR to a host document directory}:/data:ro
      - holusight-index:/index
    restart: unless-stopped

volumes:
  holusight-index:
